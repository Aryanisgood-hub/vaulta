name: vaulta
description: Secure finance management for college clubs, powered by Firebase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  flutter_riverpod: ^2.5.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  uuid: ^4.5.0
  image: ^4.2.0
  excel: ^4.0.6
  pdf: ^3.11.1
  share_plus: ^10.0.2
  intl: ^0.19.0
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2
  google_sign_in: ^7.1.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/demo/

  # Roboto Condensed is bundled so every glyph (digits, the rupee sign) comes from one font.
  fonts:
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
        - asset: assets/fonts/RobotoCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/RobotoCondensed-ExtraBold.ttf
          weight: 800

# App icon (run once:  dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#2A3747"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#2A3747"
    theme_color: "#2A3747"

# Native launch screen (run once:  dart run flutter_native_splash:create)
# Makes the very first moment navy with the V, instead of a white flash.
flutter_native_splash:
  color: "#2A3747"
  image: assets/images/vaulta_mark.png
  web: false
  android_12:
    color: "#2A3747"
    image: assets/icon/splash_android12.png
